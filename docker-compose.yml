services:
  mysql:
    image: mysql:8.0
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nest
      MYSQL_USER: nestuser
      MYSQL_PASSWORD: nestpass
    networks:
      - synthwaveblues
  test-db:
    image: mysql:8.0
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nest
      MYSQL_USER: nestuser
      MYSQL_PASSWORD: nestpass
    networks:
      - synthwaveblues
networks:
  synthwaveblues:
    driver: bridge
